schema_version: "1.0"
matrix_id: EET-RTM-2026-08-29
purpose: >-
  将三份历史来源的全部一级章节和规则族映射到新工具集的独立能力、组合 Profile、
  适配器、契约、建设路线或历史档案。映射表示“规范去向明确”，不表示实现完成。

target_kinds:
  ARCHITECTURE: 跨模块边界、目录职责与组合约束
  CAPABILITY: 可被单独调用、独立产出证据的能力
  CONTRACT: 跨能力交换的稳定数据契约
  PROFILE: 对能力进行可选组合并将事实映射为 Gate/Verdict 的配置
  ADAPTER: 特定工具、Provider、环境或公司工作流的可替换接入层
  ROADMAP: 尚待建设或验证的 Campaign
  ARCHIVE: 仅作历史、研究或示例保留

source_coverage:
  LEGACY-CFA-MAIN-V3.1:
    expected: {numbered_chapters: "0-31", appendices: [A, B, C, D, E, F]}
    mappings:
      - map_id: CFA-M-001
        source_sections: ["0", "1", "2"]
        requirements: [内网源码优先, 能力导向, 不把模型或Provider固化进证据语义, V1边界]
        targets:
          - {kind: ARCHITECTURE, id: architecture/system-boundaries}
          - {kind: CONTRACT, id: contracts/capability-contract}
      - map_id: CFA-M-002
        source_sections: ["3"]
        requirements: [Stable Evidence Kernel, Stable Capability Contract, Replaceable Provider, Profile不改变证据语义]
        targets:
          - {kind: CAPABILITY, id: evidence-kernel}
          - {kind: CONTRACT, id: evidence-bundle}
          - {kind: ADAPTER, id: provider-registry}
          - {kind: PROFILE, id: profile-contract}
      - map_id: CFA-M-003
        source_sections: ["4", "5"]
        requirements: [受控联网, 内部Mirror, 固定源码构建, 固定制品, DSH接入, 统一目录]
        targets:
          - {kind: CAPABILITY, id: third-party-supply-chain}
          - {kind: ADAPTER, id: provider-supply-chain}
          - {kind: ADAPTER, id: company-runtime-boundary}
          - {kind: ROADMAP, id: windows-company-deployment}
        migration_note: 历史环境用语保留为来源证据；活动网络、模型、密钥、外发、下载和制品来源策略只由company-runtime-boundary拥有。
      - map_id: CFA-M-004
        source_sections: ["6", "7", "8", "9", "10"]
        requirements: [Native Baseline, Lite题库, CodeGraph与Codebase-Memory候选Intake, 固定执行宿主, 禁止latest]
        targets:
          - {kind: CAPABILITY, id: code-fact}
          - {kind: ADAPTER, id: structural-navigation-providers}
          - {kind: ROADMAP, id: provider-intake-campaign}
        migration_note: Provider名称保留为候选适配器，不进入能力契约。
      - map_id: CFA-M-005
        source_sections: ["11"]
        requirements: [SOURCE_RECEIPT, BUILD_RECEIPT, DSH_EXECUTION_RECEIPT]
        targets:
          - {kind: CAPABILITY, id: third-party-supply-chain}
          - {kind: CONTRACT, id: receipt}
      - map_id: CFA-M-006
        source_sections: ["12", "13"]
        requirements: [两级Bake-off, 正确性优先, 控制变量, Lite Gate, Full Validation, Provider激活证据]
        targets:
          - {kind: ROADMAP, id: provider-benchmark-campaign}
          - {kind: CONTRACT, id: benchmark-result}
          - {kind: ADAPTER, id: provider-registry}
      - map_id: CFA-M-007
        source_sections: ["14", "15", "16", "17", "18"]
        requirements: [ReviewEvidence, CrossSourceEvidence, ExactCppEvidence, LexicalEvidence, HumanOnboarding候选]
        targets:
          - {kind: CAPABILITY, id: code-fact}
          - {kind: ADAPTER, id: specialized-provider-catalog}
          - {kind: ROADMAP, id: specialized-provider-intake}
        migration_note: Human Onboarding是消费者视图；AUTHORITY_DOCS_EVIDENCE重命名为CROSS_SOURCE_EVIDENCE，权威等级另行判定。
      - map_id: CFA-M-008
        source_sections: ["19", "20"]
        requirements: [证据分类, Normative与Observational分离, Fail-Closed]
        targets:
          - {kind: CAPABILITY, id: evidence-kernel}
          - {kind: CAPABILITY, id: authority-governance}
          - {kind: CONTRACT, id: claim-evidence}
        migration_note: 旧单轴Evidence Level拆为derivation_method、assertion_source、authority与verification四个正交字段。
      - map_id: CFA-M-009
        source_sections: ["21", "22"]
        requirements: [窄Tool Policy, 永久/可衰减限制分离, Profile路由, Thin Router后置]
        targets:
          - {kind: PROFILE, id: tool-access-policy}
          - {kind: ROADMAP, id: optional-thin-dispatcher}
      - map_id: CFA-M-010
        source_sections: ["23", "24", "25"]
        requirements: [Recalibration, Removal Evidence, Index Freshness, Coverage, Capability与Provider生命周期]
        targets:
          - {kind: CAPABILITY, id: code-fact}
          - {kind: CONTRACT, id: provider-qualification}
          - {kind: ADAPTER, id: provider-registry}
        migration_note: 生命周期拆分为artifact、deployment/index、profile-binding三条状态轴；不再有跨环境全局ACTIVE。
      - map_id: CFA-M-011
        source_sections: ["26", "27", "28", "29"]
        requirements: [实施路线, 公司专属Provider触发条件, 成功标准, 失败标准]
        targets:
          - {kind: ROADMAP, id: implementation-sequence}
          - {kind: ROADMAP, id: release-gates}
      - map_id: CFA-M-012
        source_sections: ["30", "31"]
        requirements: [旧推荐目录, 总结]
        targets:
          - {kind: ARCHIVE, id: legacy-architecture-rationale}
          - {kind: ARCHITECTURE, id: toolkit-folder-architecture}
      - map_id: CFA-M-013
        source_sections: ["Appendix A", "Appendix B", "Appendix C", "Appendix D"]
        requirements: [QuickStart排除理由, 候选研究定位, 官方来源, 历史核验事实]
        targets:
          - {kind: ARCHIVE, id: provider-research-2026-08}
          - {kind: ADAPTER, id: provider-catalog-2026-08}
        migration_note: 时间敏感事实为RESEARCHED_REVERIFY_REQUIRED，不能直接变成ACTIVE。
      - map_id: CFA-M-014
        source_sections: ["Appendix E", "Appendix F"]
        requirements: [版本变化矩阵, Registry示例, Model Profile示例]
        targets:
          - {kind: ARCHIVE, id: historical-version-delta}
          - {kind: CONTRACT, id: provider-registry-example}
        migration_note: 示例值必须标EXAMPLE_ONLY，尤其不得把示例ACTIVE当作真实部署状态。

  LEGACY-CFA-POST-V1.1:
