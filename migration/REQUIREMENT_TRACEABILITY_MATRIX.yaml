coverage_assertion:
  document_structure_coverage: COMPLETE_BY_CHAPTER_GROUP
  rule_family_coverage: COMPLETE_WITH_RECORDED_GAPS
  semantic_equivalence: NOT_YET_INDEPENDENTLY_VALIDATED
  implementation_coverage: NOT_IMPLEMENTED
  validation_coverage: NOT_VALIDATED
  open_conflicts_register: migration/RULE_ALIAS_AND_CONFLICT_REGISTER.yaml
