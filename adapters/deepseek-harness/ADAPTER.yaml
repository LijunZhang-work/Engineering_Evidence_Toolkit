schema: engineering-evidence-toolkit/adapter/v1
id: deepseek-harness
version: 0.1.0-draft
spec_status: DESIGNED
verification_status: PARTIAL
support_matrix_ref: ../HARNESS_CAPABILITY_MATRIX.yaml
automation_policy_ref: ../../governance/AUTOMATION_AND_HOOK_POLICY.md

project_skill_entrypoint:
  path: .dsh/skills/engineering-evidence-toolkit/SKILL.md
  discovery_source: project-dsh
  discovery_rank: 100
  format_basis: deepseek-harness/docs/subsystems/skills.zh.md
  file_status: PRESENT
  runtime_validation_status: PASSED
  limitation: >-
    Project Skill discovery and GLM Web invocation were observed on the pinned Harness
    revision. This does not prove Capability compatibility, acceptance, or lifecycle qualification.

purpose: >-
  Map a DeepSeek Harness task to toolkit capability contracts and return structured
  artifacts without embedding provider-specific logic in prompts.

glm_compatibility_observer:
  model: GLM
  role: FINAL_COMPATIBILITY_OBSERVER
  must_run_after: TOOLKIT_MULTI_ANGLE_REVIEW
  claim_authority: NONE
  gate_authority: NONE
  qualification_authority: NONE
  lifecycle_promotion_authority: NONE

runtime_observation:
  status: PARTIAL
  observation_ref: ../../acceptance/harness-validation/GLM_COMPATIBILITY_OBSERVATION.yaml
  screenshot_ref: ../../acceptance/harness-validation/glm-final-observation.png
  capability_acceptance_status: NOT_RUN
  environment_blocker: >-
    The Harness read-only preset denied child-process temporary-directory writes. Doctor
    and tempfile-dependent tests were therefore environment-blocked, not Toolkit-failed.

verification_runtime_profile:
  source_tree_write: DENY
  os_temp_write: ALLOW_FOR_BOUNDED_CHECKS
  external_run_artifact_write: ALLOW
  secrets: HARNESS_PROVIDER_UI_ONLY
  fully_read_only_use: INSPECTION_ONLY
  mismatch_result: ENVIRONMENT_BLOCKED
  rule: >-
    Executable verification needs a split boundary: repository source remains read-only,
    while an OS temporary directory and declared external run directory are writable.
    A preset that blocks all temporary writes cannot produce a test Verdict.

supported_capabilities:
  - capability_id: code-fact
    contract_version: v1
    status: DESIGNED
    verification_status: NOT_RUN
  - capability_id: experience-memory
    contract_version: v1
    status: DESIGNED
    verification_status: NOT_RUN

input_mapping:
  required:
    - task_id
    - capability_id
    - capability_request
    - workspace_snapshot_ref
  optional:
    - profile_binding_ref
    - provider_selection
    - time_budget
    - resource_budget

output_mapping:
  required:
    - capability_result_status
    - evidence_bundle_refs
    - invocation_receipt
    - unresolved_items
  forbidden_rewrites:
    - provider error to no finding
    - inconclusive to pass
    - partial coverage to exhaustive absence
    - model inference to authoritative fact

runtime_boundary_ref: ../company-runtime-boundary/ADAPTER.yaml

action_policy:
  source_tree_write: DENY
  os_temp_write: ALLOW_FOR_BOUNDED_CHECKS
  run_artifact_write: ALLOW
  submit_or_merge: DENY
  provider_selection: explicit_or_profile_bound
  unattended_execution: allowed_within_declared_budget
  blocking_question_policy: >-
    Continue independent, non-destructive work and record unresolved input. Pause
    only when no safe useful action remains or new authority is required.

tool_surface:
  principle: narrow_and_receipted
  requirements:
    - expose capability operations rather than provider-native internals
    - preserve raw tool errors in receipts
    - record command/tool identity and snapshot
    - never synthesize success after timeout or missing configuration

prompt_boundary:
  allowed:
    - select declared capability and mode
    - supply a bounded request
    - explain returned evidence and ceilings
  forbidden:
    - mark providers ACTIVE
    - install latest dependencies
    - bypass adapter permissions
    - invent missing repositories or build context
    - override profile gates with narrative confidence

hook_boundary:
  runtime_status: NOT_IMPLEMENTED
  lifecycle_hook_support: NOT_ASSESSED
  automatic_business_source_mutation: forbidden
  unsupported_or_untrusted_effect: NOT_EXECUTED
  rule: >-
    Do not project another Harness hook model onto DeepSeek Harness. Event support,
    blocking semantics, timeout and trust must be verified in the target environment
    before any automatic check is claimed.

receipts:
  - harness_version
  - adapter_version
  - capability_contract_version
  - request_digest
  - workspace_snapshot_id
  - selected_provider_receipts
  - tool_invocations_and_exit_status
  - start_end_timestamps
  - resource_and_timeout_events
  - output_bundle_ids

acceptance_refs:
  - capabilities/code-fact/ACCEPTANCE.yaml#CF-D003

implementation_note: >-
  Skill discovery, custom-model Web invocation, Windows workspace registration and
  read-only validator execution have a content-addressed partial runtime observation.
  No Capability integration, acceptance execution or lifecycle qualification is asserted.
