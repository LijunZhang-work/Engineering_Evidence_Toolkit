schema_version: 1
id: observability-planner
name: Observability Planner
version: 0.1.0-draft
status: DESIGNED
kind: independent_capability
spec: SPEC.md
entrypoint:
  operation: design_observation_plan
  callable_without_profile: true
inputs:
  required: [signal_lineage, module_constraints]
  optional: [existing_observability, dt_harness, performance_budget, retention_policy]
outputs:
  primary: observation_plan
  includes: [dt_plan, business_plan, correlation_scheme, extraction_plan, risk_controls]
side_effects:
  repository_mutation: forbidden
  external_mutation: forbidden
  allowed_writes: [plan_artifacts]
failure_policy: fail_closed
result_states: [PLANNED, PARTIAL, CONFLICTED, NOT_QUALIFIED]
evidence_ceiling: "设计完成不代表插桩已实现、性能已验证或数据已采集"

